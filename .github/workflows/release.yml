name: Tests & Release

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  test-and-lint:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [8.2, 8.3, 8.4]
        laravel: [10.*, 11.*, 12.*, 13.*]
        include:
          - laravel: 10.*
            testbench: 8.*
          - laravel: 11.*
            testbench: 9.*
          - laravel: 12.*
            testbench: 10.*
          - laravel: 13.*
            testbench: 11.*
        exclude:
          - php: 8.2
            laravel: 13.*
          - php: 8.4
            laravel: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Install dependencies
        env:
          COMPOSER_NO_BLOCKING: 1
          COMPOSER_NO_SECURITY_BLOCKING: 1
        run: |
          # Align core framework dependencies
          composer require "illuminate/support:${{ matrix.laravel }}" "illuminate/queue:${{ matrix.laravel }}" --no-interaction --no-update
          # Align corresponding Testbench version as a development dependency
          composer require "orchestra/testbench:${{ matrix.testbench }}" --dev --no-interaction --no-update
          # Use composer update to resolve and install matrix versions
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run Pint
        run: ./vendor/bin/pint --test

      - name: Execute tests
        run: vendor/bin/pest

  release:
    needs: test-and-lint
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract Version and Notes from Changelog
        id: changelog
        run: |
          # Verify that CHANGELOG.md exists before reading
          if [ ! -f CHANGELOG.md ]; then
            echo "CHANGELOG.md not found in the root of the project!"
            exit 1
          fi

          # Extract version (e.g. v1.1.1)
          VERSION=$(sed -n 's/^## \[\(v[0-9.]*\)\].*/\1/p' CHANGELOG.md | head -n1)
          
          if [ -z "$VERSION" ]; then
            echo "No version found in CHANGELOG.md matching '## [vX.Y.Z]'"
            exit 1
          fi
          
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Extract release notes between the selected version and next heading
          awk "/^## \[$VERSION\]/{flag=1;next}/^## /{flag=0}flag" CHANGELOG.md > release_notes.md
          
          echo "Detected version: $VERSION"
          echo "Notes content:"
          cat release_notes.md

      - name: Check if Tag Exists
        id: check_tag
        run: |
          if git rev-parse "$VERSION" >/dev/null 2>&1; then
            echo "Tag $VERSION already exists. Skipping release."
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "Tag $VERSION does not exist. Proceeding with release."
            echo "exists=false" >> $GITHUB_OUTPUT
          fi
        env:
          VERSION: ${{ steps.changelog.outputs.VERSION }}

      - name: Create Release and Tag
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.changelog.outputs.VERSION }}
          body_path: release_notes.md
          name: ${{ steps.changelog.outputs.VERSION }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}